general {
    hide_cursor = true
}

background {
    monitor =
    path = ~/Pictures/Wallpapers/Claude_Monet,_French_-_The_Japanese_Footbridge_and_the_Water_Lily_Pool,_Giverny_-_Google_Art_Project.jpg
    blur_passes = 3
    blur_size = 8
    brightness = 0.8
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.3
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.3)
    inner_color = rgba(0, 0, 0, 0.5)
    font_color = rgb(255, 255, 255)
    fade_on_empty = true
    placeholder_text = <i>Senha...</i>
    hide_input = false
    check_color = rgba(100, 255, 100, 0.8)
    fail_color = rgba(255, 100, 100, 0.8)
    fail_text = <i>Senha incorreta</i>
    capslock_color = rgba(255, 200, 0, 0.8)
    position = 0, -100
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(255, 255, 255, 0.9)
    font_size = 72
    font_family = JetBrains Mono
    position = 0, 100
    halign = center
    valign = center
}
