#!/bin/bash
# ─────────────────────────────────────────────────────────────────────────────
#  neofetch config — gruvbox edition
# ─────────────────────────────────────────────────────────────────────────────

# ── Info Layout ──────────────────────────────────────────────────────────────
print_info() {
    info title
    info underline

    info "OS" distro
    info "Kernel" kernel
    info "Uptime" uptime
    info "Packages" packages
    info "Shell" shell
    info "Terminal" term
    info "CPU" cpu
    info "Memory" memory

    info cols
}

# ── General ──────────────────────────────────────────────────────────────────
title_fqdn="off"
kernel_shorthand="on"
distro_shorthand="off"
os_arch="on"
uptime_shorthand="tiny"

# ── Memory ───────────────────────────────────────────────────────────────────
memory_percent="on"
memory_unit="mib"

# ── Packages ─────────────────────────────────────────────────────────────────
package_managers="tiny"

# ── Shell ────────────────────────────────────────────────────────────────────
shell_path="off"
shell_version="on"

# ── CPU ──────────────────────────────────────────────────────────────────────
speed_type="bios_limit"
speed_shorthand="off"
cpu_brand="on"
cpu_speed="on"
cpu_cores="physical"
cpu_temp="off"

# ── GPU ──────────────────────────────────────────────────────────────────────
gpu_brand="on"
gpu_type="dedicated"

# ── Resolution ───────────────────────────────────────────────────────────────
refresh_rate="off"

# ── GTK / Themes ─────────────────────────────────────────────────────────────
gtk_shorthand="off"
gtk2="on"
gtk3="on"

# ── Disk ─────────────────────────────────────────────────────────────────────
disk_show=('/')
disk_subtitle="mount"
disk_percent="on"
disk_display="off"

# ── Colors & Style ───────────────────────────────────────────────────────────
# Gruvbox: 3=yellow, 2=green, 1=red, 4=blue, 5=purple, 6=aqua
colors=(3 6 2 1 4 5)
bold="on"
underline_enabled="on"
underline_char="-"
separator=":"
block_range=(0 15)
color_blocks="on"
block_width=3
block_height=1
col_offset="auto"

# ── Progress Bars ────────────────────────────────────────────────────────────
bar_char_elapsed="-"
bar_char_total="="
bar_border="on"
bar_length=20
bar_color_elapsed="distro"
bar_color_total="distro"

# ── Image / ASCII ────────────────────────────────────────────────────────────
image_backend="ascii"
image_source="auto"
ascii_colors=(3 1 2)
ascii_bold="on"
gap=3
crop_mode="normal"
crop_offset="center"
image_size="auto"

# ── Misc ─────────────────────────────────────────────────────────────────────
stdout="off"
